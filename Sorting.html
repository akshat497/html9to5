      #modal {

        width: 100%;

        background-color: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1;
      }
      .modal-content {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        min-width: 300px;
      }
      .close {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 20px;
        cursor: pointer;
      }
      .applyButton{
        background-color: blue;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;

      let copy = [...products];

      function applyPriceFilter() {
        let range = document.querySelector("input[type='range']");
        let sorted=products.sort((a,b)=>a.price-b.price)
        let min=sorted[0].price
        console.log(min)
        
        let max=sorted[sorted.length-1].price
        console.log(max)
        let value = range.value;
        console.log(value)
        range.min=min
        range.max=max
        let filtered=products.filter((product)=>product.price>=min && product.price<=value)
        console.log(filtered)
        tbody.innerHTML=""
        DisplayData(filtered)
      
        

      }
      function reset(){
        tbody.innerHTML=""
        DisplayData(copy)
        count=1
      }
      function SortProducts() {
        let sortButton = document.getElementById("sortButton");
        if (count == 1) {
          tbody.innerHTML = "";
          let sorted = products.sort((a, b) => a.id - b.id);
          DisplayData(sorted);
          sortButton.innerText = "Desc";
          count = 2;
        } else if (count == 2) {
          tbody.innerHTML = "";
          let sorted = products.sort((a, b) => b.id - a.id);
          DisplayData(sorted);
          sortButton.innerText = "Original";
          count = 3;
        } else if (count == 3) {
          tbody.innerHTML = "";
          DisplayData();
          sortButton.innerText = "Asc";
          count = 1;
        }
      }

      function DisplayData(mainData) {
        if (mainData === undefined) {
          mainData = copy;
        }
        mainData.map((product) => {
          let row = document.createElement("tr");
          //===============================================================================================
          let id = document.createElement("td");
          let Name = document.createElement("td");
          let Category = document.createElement("td");
          let Price = document.createElement("td");
          let Stock = document.createElement("td");

          id.innerText = product.id;
          Name.innerText = product.name;
          Category.innerText = product.category;
          Price.innerText = product.price;
          Stock.innerText = product.stock;

          row.append(id, Name, Category, Price, Stock);
          tbody.append(row);
        });
      }
      DisplayData(products);

      function ModalOpen() {
        // show modal
        modal.style.display = "flex";

        // get modal-content
        let modalContent = document.querySelector(".modal-content");
        let applyButton=document.createElement("button")
        applyButton.innerText="Apply"
        applyButton.setAttribute('class','applyButton')
        applyButton.addEventListener('click',()=>{
          applyfilter()
        })

        // clear old content
        modalContent.innerHTML = "";

        // create select
        let selector = document.getElementById("selector");

        // store unique categories
        let uniqueCategories = new Set();

        products.forEach((product) => {
          uniqueCategories.add(product.category);
        });

        // create options
        uniqueCategories.forEach((category) => {
          let option = document.createElement("option");

          option.innerText = category;
          option.value = category;

          selector.append(option);
        });
        

        modalContent.append(selector,applyButton);
      }

      function closeModal() {
        modal.style.display = "none";
      }

      function applyfilter(){
        let selector=document.querySelector("select")

        let value=selector.value
        console.log(value)
        let filtered =products.filter((product)=>   product.category===value )
        console.log(filtered)
        tbody.innerHTML=""
        DisplayData(filtered)
        // closeModal()
      }
   
   
       function loadCategories(){
         let selector = document.getElementById("selector");

        // store unique categories
        let uniqueCategories = new Set();

        products.forEach((product) => {
          uniqueCategories.add(product.category);
        });
         uniqueCategories.forEach((category) => {
          let option = document.createElement("option");
