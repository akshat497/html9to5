      function advanceSplit(text, delimiter) {
        let newString = "";
        let splitted_string = [];
        let string_count = {};
        let count = 0;

        for (let i = 0; i < text.length; i++) {
          if (text[i] === delimiter) {
            splitted_string.push(newString);
            if (string_count[newString]) {
              string_count[newString]++;
            } else {
              string_count[newString] = 1;
            }

            newString = "";
          } else {
            newString = newString + text[i];
          }
          if (i == text.length - 1) {
            if (string_count[newString]) {
              string_count[newString]++;
            } else {
              string_count[newString] = 1;
            }
            splitted_string.push(newString);
          }
        }
        return [splitted_string, string_count];
      }

      //async await is a syntactic sugar over promise. it makes the code look cleaner and easier to understand. it is used to handle asynchronous operations in a more synchronous way. it can only be used inside an async function.
      async function getData() {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/todos/",
        );
        const data = await response.json(); //json method is used to convert the response into json format. it also returns a promise which can be resolved using then method.
        console.log("data", data);
        fetchData(data);
        return data;
      }

      getData();

      async function fetchData(data) {
        console.log(data);

        const tableBody = document.getElementById("tbody");

        for (i of data) {
          const row = document.createElement("tr");
          row.id = i.id;
          row.style.cursor = "pointer";
          row.style.fontSize = "20px";

          const userId = document.createElement("td");
          const id = document.createElement("td");
          const title = document.createElement("td");
          const completed = document.createElement("td");

          userId.innerText = i.userId;
          id.innerText = i.id;
          title.innerText = i.title;
          completed.innerText = i.completed;

          row.append(userId, id, title, completed);
          row.addEventListener("dblclick", function () {
            Bold(this);
          });

          row.addEventListener("mouseover", function () {
            this.style.backgroundColor = "lightgray";
          });

          row.addEventListener("mouseout", function () {
            this.style.backgroundColor = "white";
          });
          tableBody.append(row);
        }

        return data;
      }

      fetchData();
      async function sort() {
        let data = await getData();
        let tableBody = document.getElementById("tbody");
        tableBody.innerHTML = "";
        let sorted = data.sort((a, b) => {
         
        //  return a.title.localeCompare(b.title);
          return Number(b.id) - Number(a.id);
        });
        fetchData(sorted);
      }
      async function Bold(row) {
        if (row.style.fontWeight == "bold") {
          row.style.fontWeight = "normal";
          row.style.color = "black";
          row.style.fontSize = "20px";
        } else {
          row.style.fontWeight = "bold";
          row.style.color = "red";
          row.style.fontSize = "25px";
        }
      }

      async function search() {
        let searchedValue = document.getElementById("search").value;
        if (searchedValue == "") {
          alert("Please enter an id to search");
          return;
        }

        if (searchedValue < 1) {
          alert("Please enter an id greater then 1 to search");
          return;
        }
        if (!Number(searchedValue)) {
          alert("Please enter an  id in number format to search");
          return;
        }

        let data = await fetchData();

        let tbody = document.getElementById("tbody");
        tbody.innerHTML = "";

        user_input = document.getElementById("search").value; //1

        for (i of data) {
          if (i.id == user_input) {
            row = document.createElement("tr");
            userId = document.createElement("td");
            id = document.createElement("td");
            title = document.createElement("td");
            completed = document.createElement("td");

            userId.innerText = i.userId;
            id.innerText = i.id;
            title.innerText = i.title;
            completed.innerText = i.completed;

            row.append(userId, id, title, completed);
            tbody.append(row);
          }
        }
      }

      async function setColor() {
        let color = document.getElementById("color").value;
        let option = document.getElementById("select").value;
        let data = await fetchData();
        if (option == "True") {
          option = true;
        } else {
          option = false;
        }

        for (i of data) {
          if (i.completed == option) {
            let row = document.getElementsByTagName("tr")[i.id];
            row.style.backgroundColor = color;
          }
        }
      }
      function reset() {

          rows[i].style.backgroundColor = "white";
        }

        console.log(rows);
